[package]
name = "portfolio"
version = "0.2.0"
authors = ["kathleenfrench <kfrench.eng@gmail.com>"]
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "portfolio"
path = "src/main.rs"

[workspace]
exclude = ["web/pterm"]

[dependencies]
actix-files = "0.6"
actix-web = "4"
config = { version = "0.14", default-features = false, features = ["yaml"] }
env_logger = "0.11"
handlebars = { version = "6", features = ["dir_source"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
